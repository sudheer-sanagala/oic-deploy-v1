name: OIC Deploy (Committed Files)

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - stage
      - develop
      - main
    types:
      - closed

# Removed the global env: OIC_INSTANCE_NAME block.
# OIC_INSTANCE_NAME will now be set as a secret within each GitHub Environment.

jobs:
  BuildAndDeployToDev:
    # This 'if' condition on the job level is robust and good as is.
    if: ${{(github.ref == 'refs/heads/develop') && ((github.event_name == 'pull_request') || (github.event_name == 'push' && !contains( github.event.head_commit.message, 'Merge pull request')))}}
    environment: # Explicit GitHub Environment for 'dev'
      name: dev # Make sure you have a GitHub Environment named 'dev' configured.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for git diff to compare across commits

      - name: Get .iar files for deployment
        id: get_iar_files
        run: |
          echo "Detecting .iar files committed in this push."
          # Tuned: Use a more concise git diff pipeline.
          # --diff-filter=AMR: Only look at Added, Modified, or Renamed files.
          # grep -i '\.iar$': Case-insensitive search for .iar at the end of the filename.
          # xargs | tr ' ': Convert newline-separated list to a single comma-separated string.
          COMMITTED_IAR_FILES=$(git diff --name-only --diff-filter=AMR ${{ github.event.before }} ${{ github.sha }} | grep -i '\.iar$' | xargs | tr ' ' ',')

          echo "Final list of .iar files for deployment: $COMMITTED_IAR_FILES"
          # Set the list of .iar files as an output of this step.
          echo "iar_files_to_deploy=$COMMITTED_IAR_FILES" >> $GITHUB_OUTPUT

      - name: Check if any .iar files were found
        # This check is still useful. It will exit successfully if no .iar files were detected.
        if: steps.get_iar_files.outputs.iar_files_to_deploy == ''
        run: |
          echo "No .iar files were found for deployment. Skipping OIC deployment."
          exit 0 # Exit successfully if nothing to deploy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Deploy OIC Integrations
        env: # Environment variables for this specific deployment step
          OIC_URL: '${{ secrets.OIC_URL }}'
          IAR_FILES: '${{ steps.get_iar_files.outputs.iar_files_to_deploy }}'
          OIC_TOKEN_URL: '${{ secrets.OIC_TOKEN_URL }}'
          OIC_CLIENT_ID: '${{ secrets.OIC_CLIENT_ID }}'
          OIC_CLIENT_SECRET: '${{ secrets.OIC_CLIENT_SECRET }}'
          OIC_SCOPE: '${{ secrets.OIC_SCOPE }}'
          # Tuned: OIC_INSTANCE_NAME is now sourced from a secret within the 'dev' environment.
          OIC_INSTANCE_NAME: '${{ secrets.OIC_INSTANCE_NAME }}'
        run: python deploy_oic.py # Assumes deploy_oic.py is in the repository root.

  BuildAndDeployToStage:
    # Your existing BuildAndDeployToStage job should be updated with the same tuning.
    # Ensure it uses 'environment: name: stage' and its associated secrets.
    if: ${{(github.ref == 'refs/heads/release') && ((github.event_name == 'pull_request') || (github.event_name == 'push' && !contains( github.event.head_commit.message, 'Merge pull request')))}}
    environment:
      name: stage # Make sure you have a GitHub Environment named 'stage' configured.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get .iar files for deployment
        id: get_iar_files
        run: |
          echo "Detecting .iar files committed in this push."
          COMMITTED_IAR_FILES=$(git diff --name-only --diff-filter=AMR ${{ github.event.before }} ${{ github.sha }} | grep -i '\.iar$' | xargs | tr ' ' ',')
          echo "Final list of .iar files for deployment: $COMMITTED_IAR_FILES"
          echo "iar_files_to_deploy=$COMMITTED_IAR_FILES" >> $GITHUB_OUTPUT
      - name: Check if any .iar files were found
        if: steps.get_iar_files.outputs.iar_files_to_deploy == ''
        run: |
          echo "No .iar files were found for deployment. Skipping OIC deployment."
          exit 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Deploy OIC Integrations
        env:
          OIC_URL: '${{ secrets.OIC_URL }}'
          IAR_FILES: '${{ steps.get_iar_files.outputs.iar_files_to_deploy }}'
          OIC_TOKEN_URL: '${{ secrets.OIC_TOKEN_URL }}'
          OIC_CLIENT_ID: '${{ secrets.OIC_CLIENT_ID }}'
          OIC_CLIENT_SECRET: '${{ secrets.OIC_CLIENT_SECRET }}'
          OIC_SCOPE: '${{ secrets.OIC_SCOPE }}'
          OIC_INSTANCE_NAME: '${{ secrets.OIC_INSTANCE_NAME }}' # Sourced from 'stage' environment secrets
        run: python deploy_oic.py